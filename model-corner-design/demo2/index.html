<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸巷 · Whale Lane</title>
<style>
  @font-face { font-family: 'Kuaile'; src: url('assets/kuaile.woff2?v=full') format('woff2'); font-display: swap; } /* 完整字库（7053 字）：标题、漫画题目、日报标题都是模型临时写的，什么字都可能有 */
  /* 英文的标题、名字、牌子和气泡用圆体 Fredoka（OFL，只有拉丁字符，每个字重约 16KB）：要 400 时给 500 的字形，小字也看得清 */
  @font-face { font-family: 'Fredoka'; src: url('assets/fredoka-500.woff2') format('woff2'); font-weight: 100 500; font-display: swap; }
  @font-face { font-family: 'Fredoka'; src: url('assets/fredoka-600.woff2') format('woff2'); font-weight: 600 900; font-display: swap; }
  :root {
    /* 一套纸张感的暖色：底、卡片、内嵌三层；墨色正文；金色只用来点缀；角色自己的颜色只用在和她有关的地方 */
    --ink: #3a2e28; --ink2: #6b5c52; --mute: #9a8a7d;
    --page: #efe5d8; --paper: #fffaf3; --paper2: #f7eee2; --paper3: #efe2d1; --line: rgba(120, 88, 56, .15);
    --gold: #d9a54a; --red: #e0566e;
    --shadow: 0 1px 2px rgba(70, 45, 25, .06), 0 8px 24px rgba(70, 45, 25, .10);
    --shadow2: 0 24px 64px rgba(40, 24, 12, .30);
    --r: 18px;
    --disp: 'Kuaile', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --body: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  /* 英文：快乐体的拉丁字母不好认，标题换圆体 Fredoka（夹着的中文照旧落到快乐体），正文换系统无衬线；日文：快乐体没有假名、汉字也是简体字形，标题和正文都换日文字体（圆体优先） */
  :root:lang(en) { --disp: 'Fredoka', 'Kuaile', 'Noto Sans CJK SC', 'PingFang SC', sans-serif; --body: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans CJK SC', 'PingFang SC', sans-serif; }
  :root:lang(ja) {
    --disp: 'Hiragino Maru Gothic ProN', 'Zen Maru Gothic', 'M PLUS Rounded 1c', 'Kosugi Maru', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
    --body: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--body); }
  body { background: radial-gradient(1100px 620px at 12% -8%, #fff7ea 0%, rgba(255, 247, 234, 0) 62%), radial-gradient(900px 640px at 105% 108%, #ead8c0 0%, rgba(234, 216, 192, 0) 60%), var(--page); }
  button { font-family: inherit; }
  #app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 0 20px 20px; }
  .card { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 顶栏：一条。左边是招牌和三个区域，右边是此刻（时间天气）、围观人数和两个按钮 */
  header.top { display: flex; align-items: center; gap: 14px; height: 70px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 40px; height: 40px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 3px 10px rgba(40, 60, 120, .18); }
  .brand b { display: block; font: 25px/1 var(--disp); letter-spacing: 3px; }
  .brand small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--mute); letter-spacing: .5px; white-space: nowrap; }
  .areas { display: flex; gap: 3px; padding: 4px; margin-left: 14px; background: var(--paper3); border-radius: 999px; box-shadow: inset 0 1px 2px rgba(70, 45, 25, .08); }
  .area { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 5px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); font: 15px var(--disp); cursor: pointer; white-space: nowrap; transition: background .15s; }
  .area:hover { background: rgba(255, 255, 255, .5); }
  .area.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(70, 45, 25, .12), 0 2px 8px rgba(70, 45, 25, .08); }
  .area .th { width: 30px; height: 30px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .85); flex: none; }
  .area .who { display: flex; padding-left: 4px; }
  .area .who img { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #fff; margin-left: -6px; background: #fff; }
  .area .s { display: none; }
  .top .gap { flex: 1; }
  .when { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 6px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); white-space: nowrap; }
  .dial { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #9a6a12; background: radial-gradient(circle at 35% 30%, #fff8dc, #f6c062); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .08); }
  .dial.dusk { color: #8a3f2a; background: radial-gradient(circle at 35% 30%, #ffe1c8, #ee8f68); }
  .dial.night { color: #eef0ff; background: radial-gradient(circle at 35% 30%, #aab6ff, #4a55a8); }
  .dial svg.i { width: 19px; height: 19px; }
  .when b { display: block; font: 20px/1 var(--disp); letter-spacing: 1px; }
  .when small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--mute); }
  .viewers { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .viewers .live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(224, 86, 110, .18); animation: pulse 1.8s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(224, 86, 110, 0); } }
  .btn { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; font: 15px var(--disp); letter-spacing: 1px; cursor: pointer; white-space: nowrap; transition: transform .1s, box-shadow .15s; }
  .btn:active { transform: translateY(1px); }
  .btn.primary, .btn.dark { background: var(--ink); color: #fff6ea; box-shadow: 0 2px 8px rgba(40, 24, 12, .22); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .btn.violet { background: linear-gradient(#9a84f0, #6b55c9); color: #fff; }
  .btn.soft { background: var(--paper3); color: var(--ink); }
  .btn.warm { background: linear-gradient(#ffcf7a, #f0a83c); color: #5a3a10; }
  .btn.new::after { content: ''; position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--paper); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  /* 加入鲸巷：页面上最显眼的按钮。暖色渐变带一圈光，每隔几秒扫过一道高光、小手挥一下；任何宽度都留着字 */
  .btn.cta { min-height: 46px; padding: 0 20px 0 15px; gap: 9px; overflow: hidden; background: linear-gradient(135deg, #ffa65e, #f0603e); color: #fff; text-shadow: 0 1px 1px rgba(140, 45, 15, .3); box-shadow: 0 4px 14px rgba(240, 96, 62, .4), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn.cta:hover { filter: brightness(1.06); box-shadow: 0 6px 20px rgba(240, 96, 62, .5), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn.cta::before { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); transform: skewX(-20deg); animation: ctaShine 6s ease-in-out infinite; pointer-events: none; }
  .btn.cta svg.i { width: 21px; height: 21px; transform-origin: 60% 85%; animation: ctaWave 6s ease-in-out infinite; }
  .btn.cta .txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
  .btn.cta .t { font-size: 16px; }
  .btn.cta .sub { margin-top: 3px; font: 11px var(--body); letter-spacing: .5px; opacity: .92; }
  @keyframes ctaShine { 0%, 68% { left: -60%; } 86%, 100% { left: 130%; } }
  @keyframes ctaWave { 0%, 70%, 92%, 100% { transform: rotate(0); } 75% { transform: rotate(-16deg); } 80% { transform: rotate(12deg); } 85% { transform: rotate(-8deg); } }
  @media (prefers-reduced-motion: reduce) { .btn.cta::before, .btn.cta svg.i { animation: none; } }
  /* 语言切换：中 / EN / 日，和区域页签同一种胶囊样式 */
  .langs { display: flex; gap: 2px; padding: 3px; flex: none; background: var(--paper3); border-radius: 999px; box-shadow: inset 0 1px 2px rgba(70, 45, 25, .08); }
  .langs button { min-width: 32px; height: 30px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); font: 600 12.5px var(--body); letter-spacing: .5px; cursor: pointer; transition: background .15s; }
  .langs button:hover { background: rgba(255, 255, 255, .5); }
  .langs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(70, 45, 25, .12), 0 2px 8px rgba(70, 45, 25, .08); }
  :lang(en) .brand b { letter-spacing: .5px; }
  .iconbtn { width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 250, 243, .92); color: var(--ink); cursor: pointer; box-shadow: 0 2px 10px rgba(40, 24, 12, .2); }

  /* 主区：左边是街（地图是主角），右边是伴读栏；两边上下对齐 */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; min-height: 0; align-items: start; }
  .stage-col { min-width: 0; min-height: 0; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
  .stage { position: relative; border-radius: var(--r); overflow: hidden; background: #e7d9c6; box-shadow: 0 0 0 1px var(--line), 0 10px 34px rgba(70, 45, 25, .18); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 地图上的小牌子：这是哪儿、此刻有什么事、光线预览 */
  .hud { position: absolute; z-index: 3; display: flex; gap: 8px; align-items: center; }
  .hud.tl { left: 14px; top: 14px; }
  .hud.tr { right: 14px; top: 14px; }
  .hud.br { right: 14px; bottom: 14px; }
  .hchip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(255, 250, 243, .93); box-shadow: 0 2px 10px rgba(40, 24, 12, .18); font-size: 13px; color: var(--ink); white-space: nowrap; backdrop-filter: blur(6px); }
  .hchip b { font: 15px var(--disp); font-weight: 400; }
  .hchip .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--mute); display: inline-block; vertical-align: middle; }
  .hchip .extra { display: inline-flex; align-items: center; gap: 7px; }
  .hchip.ev { cursor: pointer; background: rgba(58, 46, 40, .9); color: #fff6ea; }
  .hchip.ev.on { background: rgba(224, 86, 110, .94); }
  .hchip.ev small { opacity: .75; font-size: 12px; }
  .todpop { position: absolute; right: 0; bottom: 46px; display: none; flex-direction: column; gap: 2px; padding: 6px; min-width: 132px; }
  .todpop.open { display: flex; }
  .todpop button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; font: 14px var(--disp); color: var(--ink2); cursor: pointer; text-align: left; }
  .todpop button:hover { background: var(--paper2); }
  .todpop button.on { background: var(--ink); color: #fff6ea; }
  .todpop .hint { padding: 4px 8px 2px; white-space: nowrap; } .todpop button { white-space: nowrap; }
  .tip { position: absolute; z-index: 4; pointer-events: none; padding: 5px 12px; font: 14px var(--disp); background: rgba(58, 46, 40, .92); color: #fff4e6; border-radius: 999px; transform: translate(-50%, -100%); white-space: nowrap; display: none; }
  .pop { position: absolute; z-index: 6; width: 270px; padding: 14px 16px 12px; transform: translate(-50%, calc(-100% - 16px)); display: none; }
  .pop::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; background: var(--paper); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .pop h4 { margin: 0 0 4px; font: 19px var(--disp); display: flex; align-items: center; gap: 6px; }
  .pop p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; color: var(--ink2); }
  .pop .live { font-size: 12.5px; background: var(--paper2); border-radius: 10px; padding: 6px 9px; margin-bottom: 9px; line-height: 1.6; }
  .pop .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pop .row .btn { min-height: 32px; padding: 0 14px; font-size: 13.5px; }
  .pop .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; cursor: pointer; color: var(--mute); }
  .hint { font-size: 12px; color: var(--mute); }

  /* 伴读栏：上面是「她们现在」，下面四个页签：动态、街区、画册、日报 */
  .side-col { display: flex; flex-direction: column; min-height: 0; height: 100%; overflow: hidden; }
  .mates { display: grid; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); }
  .mates h3 { margin: 4px 8px 4px; font: 15px var(--disp); color: var(--mute); font-weight: 400; display: flex; align-items: center; justify-content: space-between; }
  .mates h3 small { font: 11.5px var(--body); }
  .mate { display: grid; grid-template-columns: 48px minmax(0, 1fr) 16px; gap: 11px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s; }
  .mate:hover { background: var(--paper2); }
  .mate .av { position: relative; width: 48px; height: 48px; }
  .mate .av img { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--c); background: #fff; }
  .mate .av .st { position: absolute; right: -3px; bottom: -2px; width: 21px; height: 21px; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .mate .av .st svg.i { width: 13px; height: 13px; }
  .mate .tx { min-width: 0; display: grid; gap: 1px; }
  .mate .nm { display: flex; align-items: baseline; gap: 7px; font: 16px var(--disp); }
  .mate .nm em { font: 10.5px var(--body); font-style: normal; color: var(--mute); background: var(--paper2); border-radius: 6px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .doing { font-size: 13px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .where { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .where i { font-style: normal; color: var(--ink2); }
  .mate > svg.i { color: var(--mute); width: 16px; height: 16px; }
  .ptabs { display: flex; gap: 4px; margin: 10px 12px 0; padding: 3px; background: var(--paper3); border-radius: 999px; }
  .ptabs button { position: relative; flex: 1; height: 34px; border: 0; border-radius: 999px; background: transparent; font: 15px var(--disp); color: var(--ink2); cursor: pointer; }
  .ptabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(70, 45, 25, .14); }
  .ptabs button.new::after { content: ''; position: absolute; top: 6px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .filters button { border: 0; border-radius: 999px; padding: 4px 11px 4px 5px; font: 13px var(--disp); background: var(--paper2); cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--ink2); }
  .filters button.txt { padding-left: 11px; }
  .filters button.on { background: var(--ink); color: #fff6ea; }
  .filters button.av { padding: 3px; }
  .filters button.av img { width: 24px; height: 24px; }
  .filters button.av.on { background: var(--c); }
  .filters img { width: 20px; height: 20px; border-radius: 50%; }
  .day { font: 13px var(--disp); color: var(--mute); margin: 12px 0 4px; display: flex; align-items: center; gap: 8px; }
  .day::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .entry { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 7px 6px; border-radius: 12px; cursor: pointer; font-size: 13px; line-height: 1.6; }
  .entry:hover { background: var(--paper2); }
  .entry img, .entry .ico { width: 30px; height: 30px; border-radius: 50%; }
  .entry .ico { display: grid; place-items: center; background: var(--paper3); color: #9a7a50; }
  .entry .ico svg.i { width: 16px; height: 16px; }
  .entry .tm { color: var(--mute); font-size: 11.5px; display: block; }
  .entry.star { background: linear-gradient(90deg, rgba(247, 213, 140, .32), rgba(247, 213, 140, 0)); }
  .entry.star .txt::before { content: '★ '; color: var(--gold); }
  .entry.new { animation: flash 1.6s; }
  @keyframes flash { from { background: rgba(247, 213, 140, .8); } }
  .entry .shot { display: block; margin-top: 6px; width: 100%; max-height: 150px; object-fit: cover; object-position: top; border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  .empty { color: var(--mute); font-size: 13px; padding: 20px 6px; text-align: center; }

  .modal { position: fixed; inset: 0; background: rgba(25, 18, 14, .55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 22px; z-index: 20; }
  .modal.open { display: flex; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: scale(.985); } }
  .panel { width: min(1260px, 100%); height: min(780px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 32vw, 410px); overflow: hidden; border-radius: 26px; background: var(--paper); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  .scene { position: relative; background: #e9dccb; min-width: 0; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .back { position: absolute; left: 16px; top: 16px; z-index: 2; }
  .scene .plaque { position: absolute; right: 16px; top: 16px; z-index: 2; font: 19px var(--disp); background: rgba(255, 248, 238, .94); padding: 7px 18px; border-radius: 999px; box-shadow: var(--shadow); display: flex; gap: 6px; align-items: center; }
  .scene .say { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2; max-width: 80%; background: rgba(255, 255, 255, .95); border-radius: 18px; padding: 10px 18px; font: 16px var(--disp); box-shadow: var(--shadow); display: none; }
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .prof { display: flex; gap: 14px; padding: 20px 22px 12px; align-items: center; }
  .prof img { width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--c); background: #fff; }
  .prof h2 { margin: 0; font: 26px var(--disp); letter-spacing: 1px; }
  .prof .role { color: var(--mute); font-size: 13px; margin-top: 2px; }
  .now { margin: 0 22px; padding: 10px 12px; border-radius: 14px; background: var(--paper2); font-size: 13.5px; display: flex; gap: 8px; align-items: center; line-height: 1.5; }
  .now svg.i { color: var(--c); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px 22px 2px; }
  .stat { font-size: 12px; color: var(--mute); display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px; }
  .stat .bar { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: #efe1cd; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; border-radius: 4px; }
  .tabs { display: flex; gap: 2px; padding: 10px 18px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; font: 16px var(--disp); padding: 8px 10px 9px; color: var(--mute); cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--c); }
  .tabbody { flex: 1; overflow: auto; padding: 14px 22px; font-size: 13.5px; line-height: 1.75; }
  .mono { position: relative; padding: 10px 14px 10px 16px; background: #fff; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--line); }
  .mono .tm { font-size: 11.5px; color: #a59484; display: flex; gap: 6px; align-items: center; }
  .mono.live { border: 1.5px dashed var(--c); }
  .mono.live .tm b { color: var(--c); font-weight: 700; }
  .note { font-size: 12px; color: var(--mute); background: var(--paper2); border-radius: 10px; padding: 6px 10px; margin-bottom: 10px; }
  .diary { background: repeating-linear-gradient(#fffdf8 0 29px, #efe0ca 29px 30px); padding: 4px 16px 10px; border-radius: 14px; margin-bottom: 14px; line-height: 30px; box-shadow: 0 1px 0 var(--line); }
  .diary h4 { margin: 0; font: 16px var(--disp); line-height: 34px; display: flex; justify-content: space-between; }

  .rm-ico { width: 74px; height: 74px; flex: none; border-radius: 50%; border: 3px solid var(--c); background: #fff; color: var(--c); display: grid; place-items: center; }

  .rm-p b { font: 15px var(--disp); font-weight: 400; }
  .rm-p .d { font-size: 12.5px; color: var(--mute); }
  .rm-p .q { font-size: 12.5px; color: #5b4b42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rm-p > svg.i { color: var(--mute); width: 16px; height: 16px; }
  .rm-objs { display: flex; flex-wrap: wrap; gap: 6px; }

  .rm-objs svg.i { width: 15px; height: 15px; }

  .form { width: min(560px, 100%); background: var(--paper); border-radius: 24px; padding: 24px 26px; font-size: 14px; line-height: 1.75; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  .form h2 { margin: 0 0 6px; font: 24px var(--disp); }
  .steps { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .steps span { background: #f2e3cf; border-radius: 999px; padding: 4px 12px; font: 13px var(--disp); }
  .steps span.on { background: #6b55c9; color: #fff; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .roles > div { padding: 10px 14px; border-radius: 16px; background: var(--paper2); border: 1px solid var(--line); }
  .roles b { display: flex; align-items: center; gap: 6px; font: 15.5px var(--disp); font-weight: 400; }
  .roles small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.55; color: var(--ink2); }
  .form a.btn { text-decoration: none; }
  @media (max-width: 560px) { .roles { grid-template-columns: 1fr; } .form .foot { flex-wrap: wrap; } .form .foot .hint { flex-basis: 100%; } }
  .form textarea { width: 100%; height: 120px; border-radius: 14px; border: 1px solid var(--line); padding: 12px; font: inherit; resize: vertical; background: #fff; }
  .form .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; align-items: center; }
  .form .foot .hint { margin-right: auto; }
  .log h3 .tools { margin-left: auto; display: flex; gap: 6px; }
  .mini { border: 0; border-radius: 999px; padding: 4px 10px 4px 8px; font: 13px var(--disp); background: #f2e3cf; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .mini:hover { background: #ead6bb; }
  .mini svg.i { width: 14px; height: 14px; }
  .letters .kinds { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 8px; }
  .letters .kinds button { border: 0; border-radius: 999px; padding: 5px 12px; font: 13px var(--disp); background: #f2e3cf; color: var(--ink); cursor: pointer; }
  .letters .kinds button.on { background: #3d302b; color: #fff4e6; }
  .letters .count { font-size: 12px; color: var(--mute); }
  .letters .mine { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; max-height: 34vh; overflow: auto; }
  .letters .mine h4 { margin: 0 0 6px; font: 16px var(--disp); }
  .letters .lt { background: #fff; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; font-size: 13.5px; box-shadow: 0 1px 0 var(--line); }
  .letters .lt .tm { font-size: 11.5px; color: #a59484; }
  .letters .lt .re { margin-top: 6px; padding: 6px 10px; border-radius: 10px; background: var(--paper2); }
  .chron { width: min(1180px, 100%); height: min(820px, 100%); background: var(--paper); border-radius: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); display: flex; flex-direction: column; overflow: hidden; }
  .chron .top { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .chron .top h2 { margin: 0; font: 24px var(--disp); }
  .chron .days { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chron .days button { border: 0; border-radius: 999px; padding: 5px 12px; font: 14px var(--disp); background: #f2e3cf; color: var(--ink); cursor: pointer; }
  .chron .days button.on { background: #3d302b; color: #fff4e6; }
  .chron .x { border: 0; background: none; cursor: pointer; color: var(--mute); }
  .chron .body { flex: 1; overflow: auto; padding: 18px 22px 24px; }
  .chron .sec { font: 17px var(--disp); margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
  .paper { background: #fffdf6; border: 1px solid #e6d6bd; border-radius: 16px; padding: 18px 22px; box-shadow: 0 2px 0 rgba(150, 115, 80, .12); }
  .paper .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double #3d302b; padding-bottom: 6px; margin-bottom: 12px; }
  .paper .mast b { font: 28px var(--disp); letter-spacing: 4px; }
  .paper .mast span { font-size: 12.5px; color: var(--mute); }
  .paper h3 { margin: 4px 0 8px; font: 26px var(--disp); line-height: 1.3; }
  .paper .lead { font-size: 15px; line-height: 1.85; margin: 0 0 14px; }
  .paper .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; border-top: 1px solid #e6d6bd; padding-top: 12px; }
  .paper .art .tag { font-size: 11.5px; color: #b0763a; }
  .paper .art b { display: block; font: 17px var(--disp); margin: 2px 0 4px; }
  .paper .art p { margin: 0; font-size: 13.5px; line-height: 1.75; }
  .paper .foot { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; border-top: 1px solid #e6d6bd; padding-top: 10px; font-size: 13.5px; }
  .paper .quote { flex: 1; min-width: 240px; display: flex; gap: 10px; align-items: center; }
  .paper .quote img { width: 36px; height: 36px; border-radius: 50%; }
  .paper .next { color: var(--mute); }
  .diaries { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .diaries .dy { background: repeating-linear-gradient(#fffdf8 0 29px, #efe0ca 29px 30px); border-radius: 14px; padding: 8px 14px 12px; line-height: 30px; font-size: 13.5px; box-shadow: 0 1px 0 var(--line); }
  .diaries .dy h4 { margin: 0; font: 16px var(--disp); display: flex; align-items: center; gap: 6px; line-height: 34px; }
  .diaries .dy h4 img { width: 24px; height: 24px; border-radius: 50%; }
  .diaries .dy h4 small { margin-left: auto; font: 12px var(--body); color: var(--mute); }
  .chron .ev { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 5px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
  .chron .ev .tm { color: #a59484; font-size: 12px; padding-top: 2px; }
  .chron .ev.star .tx::before { content: '★ '; color: var(--gold); }
  .chron .thumbs { display: flex; gap: 12px; flex-wrap: wrap; }
  .chron .thumbs button { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; font: 14px var(--disp); color: var(--ink); }
  .chron .thumbs img { display: block; width: 150px; height: 150px; object-fit: cover; object-position: top; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .18); margin-bottom: 4px; }
  .chron .empty { color: var(--mute); font-size: 13.5px; }
  .lane { display: grid; gap: 12px; padding-top: 4px; }
  .lane .box { background: var(--paper2); border-radius: 14px; padding: 10px 14px 12px; }
  .lane .box .sec { margin: 0 0 8px; }
  .lane .row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .lane .row:last-child { border-bottom: 0; }
  .lane .row .k { flex: none; min-width: 64px; max-width: 42%; color: #a59484; font-size: 12.5px; }
  .lane .row .v { flex: 1; }
  .lane .row .v small { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; }
  .lane .row img { width: 22px; height: 22px; border-radius: 50%; vertical-align: -6px; margin-right: 4px; }
  .lane .now { color: #c0533a; font-weight: 600; }
  .lane .bar { height: 6px; border-radius: 4px; background: #efe1cd; overflow: hidden; margin-top: 5px; }
  .lane .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f0a95a, #e0566e); }
  .lane .note { background: #fff8e2; border: 1px solid #ecd9a8; border-radius: 10px; padding: 6px 10px; margin: 4px 0; font-size: 13px; }
  .lane .note small { color: var(--mute); margin-left: 6px; }
  @media (max-width: 760px) { .diaries { grid-template-columns: 1fr; } .chron .days { margin-left: 0; } }
  /* 画册：两列小卡片 */
  .shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 4px; }
  .album { border: 0; padding: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
  .album img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: top; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 4px 12px rgba(70, 45, 25, .12); transition: transform .15s; }
  .album:hover img { transform: translateY(-2px); }
  .album.cg img { aspect-ratio: 4 / 3; object-position: center; }
  .album b { display: block; margin-top: 6px; font: 15px var(--disp); font-weight: 400; }
  .album .tm { display: block; color: var(--mute); font-size: 11.5px; }
  /* 日报（伴读栏里的最新一期） */
  .mini-paper { background: #fffdf6; border: 1px solid #ead9be; border-radius: 14px; padding: 14px 16px; }
  .mini-paper .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double var(--ink); padding-bottom: 5px; margin-bottom: 10px; }
  .mini-paper .mast b { font: 22px var(--disp); letter-spacing: 3px; font-weight: 400; }
  .mini-paper .mast span { font-size: 12px; color: var(--mute); }
  .mini-paper h4 { margin: 2px 0 6px; font: 19px/1.35 var(--disp); font-weight: 400; }
  .mini-paper p { margin: 0 0 10px; font-size: 13px; line-height: 1.8; color: var(--ink2); }
  .mini-paper .art { border-top: 1px dashed #e6d6bd; padding-top: 8px; margin-top: 8px; }
  .mini-paper .art .tag { font-size: 11px; color: #b0763a; }
  .mini-paper .art b { display: block; font: 15px var(--disp); font-weight: 400; margin: 1px 0 3px; }
  .mini-paper .more { margin-top: 12px; width: 100%; justify-content: center; }
  .comic { max-width: min(96vw, 1100px); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: zoom-out; }
  .comic img { max-width: 100%; max-height: calc(100vh - 110px); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); background: #fff; }
  .comic .cap { color: #fff4e6; font: 18px var(--disp); display: flex; gap: 12px; align-items: baseline; }
  .comic .cap span { font: 13px var(--body); opacity: .75; }
  .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(61, 48, 43, .95); color: #fff4e6; padding: 10px 18px; border-radius: 999px; font: 14px var(--disp); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 80vw; text-align: center; }
  .toast.show { opacity: 1; }
  .credit { font-size: 11px; color: var(--mute); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
  .credit a { color: inherit; }
  /* 顶栏放不下时由 fitHeader() 一级一级收（英文、日文比中文长，按实际宽度来）：短区域名 → 按钮只留图标 → 收起缩略图和日期 → 收起围观人数和按钮副标题 → 收起招牌字 */
  header.top { min-width: 0; } header.top > :not(.gap) { flex-shrink: 0; } /* 不许挤扁（「加入鲸巷」有 overflow:hidden，会被压得只剩半截字） */
  .top.fit1 .area .n { display: none; } .top.fit1 .area .s { display: inline; }
  .top.fit2 .btn .lbl, .top.fit2 .viewers .lbl { display: none; } .top.fit2 .btn { padding: 0 12px; }
  .top.fit3 .areas { margin-left: 4px; } .top.fit3 .area .th { display: none; } .top.fit3 .area { padding: 0 12px; } .top.fit3 .when small { display: none; }
  .top.fit4 .viewers, .top.fit4 .btn.cta .sub { display: none; } .top.fit5 .brand b { display: none; }
  /* 中等宽度：顶栏先收起副标题和按钮文字 */
  @media (max-width: 1500px) { .brand small { display: none; } }
  @media (max-width: 1320px) { .area .n { display: none; } .area .s { display: inline; } .btn .lbl { display: none; } .btn { padding: 0 12px; } .viewers .lbl { display: none; } }
  @media (max-width: 1080px) { .areas { margin-left: 4px; } .area .th { display: none; } .area { padding: 0 12px; } .when small { display: none; } main { grid-template-columns: minmax(0, 1fr) 320px; } }
  @media (max-width: 760px) {
    .panel { grid-template-columns: 1fr; grid-template-rows: minmax(180px, 40%) minmax(0, 1fr); }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    /* 场景窄：「回到街上」只留箭头（标题在 aria-label 里），店牌放不下就省略 */
    .scene .back { padding: 0 11px; } .scene .back .blbl { display: none; }
    .scene .plaque { max-width: calc(100% - 84px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .diaries { grid-template-columns: 1fr; } .chron .days { margin-left: 0; }
  }
  /* 手机：整页往下滚。招牌和此刻在上，三个区域一行，地图占满宽度，她们三个并排，下面是页签 */
  @media (max-width: 820px) {
    html, body { height: auto; overflow: auto; }
    #app { height: auto; padding: 0 12px 16px; }
    header.top { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 10px; }
    .brand b { font-size: 22px; } .brand img { width: 36px; height: 36px; }
    .areas { order: 5; width: 100%; margin: 0; } .area { flex: 1; justify-content: center; } .area .th { display: block; width: 26px; height: 26px; }
    .viewers { display: none; }
    .when { height: 40px; } .when b { font-size: 17px; }
    main { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .stage-col { height: auto; }
    .side-col { height: auto; overflow: visible; }
    .mates { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .mates h3 { grid-column: 1 / -1; }
    .mate { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 8px 4px; }
    .mate > svg.i, .mate .where, .mate .nm em { display: none; }
    .mate .tx { justify-items: center; width: 100%; }
    .mate .doing { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 12px; }
    .pbody { overflow: visible; }
    .modal { padding: 10px; }
    .hud.tl { left: 8px; top: 8px; } .hud.tr { right: 8px; top: 8px; } .hud.br { right: 8px; bottom: 8px; }
    .hchip { height: 28px; padding: 0 10px 0 8px; font-size: 11.5px; gap: 5px; } .hchip b { font-size: 13px; } .hchip svg.i { width: 14px; height: 14px; }
    .hchip .extra, .hchip.ev small { display: none; }
    .iconbtn { width: 32px; height: 32px; }
    /* 语言：手机上只露出当前那个，点开往下展开另外两个（盖在下面的内容上，不挤顶栏） */
    header.top { gap: 8px; } .top .gap { display: none; } .when { margin-left: auto; padding: 0 12px 0 5px; } #letterBtn { padding: 0 10px; }
    :lang(en) .brand b { font-size: 18px; letter-spacing: 0; }
  }
  @media (max-width: 370px) { .when .dial { display: none; } .when { padding: 0 12px; }
    .area { gap: 6px; padding: 0 8px 0 4px; } .area .who img { width: 18px; height: 18px; }
    .langbox { position: relative; width: 40px; height: 36px; }
    .langs { position: absolute; top: 0; right: 0; z-index: 16; flex-direction: column; border-radius: 18px; }
    .langs button { height: 30px; min-width: 34px; padding: 0 6px; }
    .langs button.on { order: -1; }
    .langs:not(.open) button:not(.on) { display: none; }
    .langs.open { background: var(--paper); box-shadow: 0 8px 24px rgba(40, 24, 12, .22); }
    /* 「加入鲸巷」浮在屏幕底部正中，翻到哪都看得见；页面底下留出它的位置 */
    #collabBtn { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 15; min-height: 52px; padding: 0 26px 0 20px; box-shadow: 0 10px 26px rgba(240, 96, 62, .45), inset 0 1px 0 rgba(255, 255, 255, .35); }
    #collabBtn:active { transform: translateX(-50%) translateY(1px); }
    #app { padding-bottom: 88px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src='assets/logo.webp' alt=""><div><b data-i18n>鲸巷</b><small data-i18n>Whale Lane · 三个 AI 女孩的海边小镇</small></div></div>
    <nav class="areas" id="areaTabs"></nav>
    <div class="gap"></div>
    <div class="when" data-i18n-title="鲸巷的时间比现实快 8 倍"><span class="dial" id="dial"></span><div><b id="clockT">17:40</b><small id="clockD">第 1 天</small></div></div>
    <div class="viewers" data-i18n-title="正在围观的人"><span class="live"></span><span id="viewers">1</span><span class="lbl" data-i18n>人在看</span></div>
    <div class="langbox"><div class="langs" id="langSeg" role="group"></div></div>
    <button class="btn ghost" id="letterBtn" data-i18n-title="给开发团队写信（不会影响她们的世界）"></button>
    <button class="btn cta" id="collabBtn" data-i18n-title="加入鲸巷，和大家一起建这条街"></button>
  </header>
  <main>
    <section class="stage-col" id="stageWrap">
      <div class="stage" id="stage">
        <canvas id="map"></canvas>
        <div class="hud tl" id="hudArea"></div>
        <div class="hud tr" id="hudEvent"></div>
        <div class="hud br"><button class="iconbtn" id="todBtn" data-i18n-title="光线预览"></button><div class="card todpop" id="todSeg"></div></div>
        <div class="tip" id="tip"></div><div class="card pop" id="pop"></div>
      </div>
    </section>
    <aside class="card side-col" id="log">
      <div class="mates" id="dock"></div>
      <div class="ptabs" id="ptabs"></div>
      <div class="pbody" id="pbody"><div class="filters" id="filters"></div><div class="entries" id="entries"></div></div>
    </aside>

  '街区最老的居民，比 GPT 还老。树上挂着的灯笼是大家一起挂的。': ['The oldest resident in town — older than GPT, even. Everyone hung the lanterns on it together.', '横丁でいちばん年上の住人。GPTよりも年上です。木の灯籠はみんなで飾りました。'],

  '最胖的一条叫「大肥鱼」，名字是 DeepSeek 起的。': ['The chubbiest one is called "Big Chonk" — DeepSeek named it.', 'いちばん太った一匹は「デブ魚」。名付け親はDeepSeek。'],

  '野餐会报名：12 人（含 3 位居民）。': ['Picnic sign-ups: 12 (including 3 townsfolk).', 'ピクニック会の参加者：12人（住人3人をふくむ）。'],

  '这本账又是 DeepSeek 抱过来的……算了，先理完。她现在一定又在摸鱼。': ['DeepSeek dumped another ledger on me… fine, I\'ll sort it first. She\'s definitely slacking off again right now.', 'この帳簿もまたDeepSeekが持ってきた……まあいいか、先に片づけよう。あの子、いまごろきっとまたサボってる。'],

  '读书会要不要选《雨天的书签》？拿自己写的书当读物，好像有点……不太谦虚。': ['Should the book club read "The Rainy-Day Bookmark"? Picking my own book feels a little… immodest.', '読書会は『雨の日のしおり』にしようかな？自分の本を選ぶのは、ちょっと……謙虚じゃないかも。'],

  '要不要我顺便帮你看看星星？': ['Want me to read the stars for you, while I\'m at it?', 'ついでに星を見てあげようか？'],
  '今晚的星图比昨天多了一颗。要不要告诉 Claude？她大概会写成一首诗。': ['Tonight\'s chart has one more star than yesterday\'s. Should I tell Claude? She\'d probably turn it into a poem.', '今夜の星図は昨日よりひとつ星が多い。Claudeに教えようかな？きっと詩にしちゃう。'],

  '委托完成——顺便补好了船帆！': ['Request done — and I patched the sail while I was at it!', '依頼完了——ついでに帆も直しておいたよ！'],
  '顺手的事情就顺手做了。这当然是额外服务，不另收费。': ['If it\'s on the way, I\'ll just do it. Bonus service, no extra charge, of course.', 'ついでのことはついでにやる。もちろんサービス、追加料金なし。'],
  'GPT 完成了渔夫的委托，还顺手补好了船帆': ['GPT finished the fisherman\'s request — and patched his sail while she was at it', 'GPTが漁師さんの依頼を完了、ついでに帆も直した'],

  // 示例：念头、日记、记忆、关系
  'Claude 又把我的账本理清楚了，她怎么这么快。下次多抱两本。': ['Claude sorted out my ledger again — how is she so fast? Next time I\'ll bring her two more.', 'Claudeがまた帳簿を片づけてくれた。なんであんなに速いの。次はもう二冊持っていこう。'],
  'GPT 今天又夸我的饭团「非常有创意」。肯定有诈，菜谱不能给她。': ['GPT called my rice balls "very creative" again today. It\'s a trap — she\'s not getting the recipe.', 'GPTが今日もわたしのおにぎりを「とても独創的」だって。絶対なにか企んでる。レシピは渡さない。'],
  '不是胖，是鲸鱼的标准体型。': ['I\'m not chubby. This is a standard whale build.', '太ってるんじゃない。クジラの標準体型なの。'],
  '今天卖出了 96 碗白米饭，自己吃了 7 碗（这是试吃，不算）。下午把一沓进货单偷偷塞给 Claude，她叹了口气，还是帮我理清楚了。晚上 GPT 来店里，说我的饭团「非常有创意」。我觉得她在套我的菜谱，没给。明天要早点开门……大概。': ['Sold 96 bowls of rice today and ate 7 myself (taste-testing, doesn\'t count). In the afternoon I slipped a stack of invoices to Claude; she sighed and sorted them out anyway. In the evening GPT came by and called my rice balls "very creative". I think she\'s fishing for my recipe. Didn\'t give it to her. I\'ll open early tomorrow… probably.', '今日は白ごはんが96杯売れて、自分で7杯食べた（味見だからノーカウント）。午後、仕入れ伝票の束をこっそりClaudeに渡したら、ため息つきながらも片づけてくれた。夜はGPTが来て、わたしのおにぎりを「とても独創的」だって。レシピを探ってる気がするから、教えなかった。明日は早めに開店……たぶん。'],
  '有位鱼片送了海苔，我试着包进饭团里，居然很好吃！决定明天上架，叫「海苔饭团」。服务器（我）今天很繁忙。': ['A fishlet sent me some seaweed, so I tried wrapping it around a rice ball — and it\'s delicious! It goes on the menu tomorrow as the "seaweed rice ball". The server (me) was very busy today.', 'お魚ちゃんが海苔をくれたので、おにぎりに巻いてみたら、すっごくおいしい！明日から「海苔おにぎり」として売り出すことに。サーバー（わたし）は今日とても混雑。'],
  '第一次做出海苔饭团': ['Made my first seaweed rice ball', '初めて海苔おにぎりを作った'],
  'Claude 帮我理了 3 本账，一分钱没收': ['Claude sorted out 3 ledgers for me and didn\'t charge a cent', 'Claudeが帳簿を3冊片づけてくれた、しかもタダで'],
  '在后山许愿牌上写了「希望 Claude 的读书会人多一点」': ['Wrote "Hope more people come to Claude\'s book club" on a wish plaque on the hill', '裏山の絵馬に「Claudeの読書会に人がもっと来ますように」と書いた'],
  'GPT 说深海食堂是「街区性价比之王」': ['GPT called the Deep Sea Diner "the best value in the neighbourhood"', 'GPTが深海食堂を「横丁いちばんのコスパ王」と呼んだ'],
  '可靠的大姐姐': ['My dependable big sis', '頼れるお姉ちゃん'],
  '竞争对手。但饭团还是要卖给她': ['A rival. Still gonna sell her rice balls, though', 'ライバル。でもおにぎりは売ってあげる'],
  '我可能理解错了 GPT 的委托，再确认一遍比较好。': ['I may have misread GPT\'s request. Better double-check.', 'GPTの依頼を読み違えたかもしれない。もう一度確かめよう。'],
  '《雨天的书签》上架了。有 14 位访客翻了第一页——第二页呢？': ['"The Rainy-Day Bookmark" is on the shelf. 14 visitors turned the first page — and the second?', '『雨の日のしおり』が棚に並んだ。14人が一ページ目をめくってくれた——二ページ目は？'],
  '今天有位访客请我代写情书。我写了，但删掉了第三段，太夸张了。': ['A visitor asked me to ghostwrite a love letter today. I did, but cut the third paragraph — far too much.', '今日、お客さんにラブレターの代筆を頼まれた。書いたけど、三段落目は消した。大げさすぎて。'],
  '上午帮 DeepSeek 翻译了三份文件。她说是「紧急任务」，其实是她要看的漫画说明书。下午《雨天的书签》终于上架，有 14 位访客翻了第一页。写作的时候我总想再改一遍，也许这就是我的毛病。睡前读了 40 页，心情很好。': ['Translated three documents for DeepSeek this morning. She called it an "urgent task"; it was the manual for a comic she wanted to read. In the afternoon "The Rainy-Day Bookmark" finally hit the shelf, and 14 visitors turned the first page. When I write I always want one more revision — maybe that\'s my flaw. Read 40 pages before bed. A good day.', '午前、DeepSeekのために書類を三つ翻訳した。「緊急の仕事」と言っていたけど、実は読みたいマンガの説明書だった。午後、『雨の日のしおり』がついに棚に並んで、14人が一ページ目をめくってくれた。書くとき、いつももう一度直したくなる。それがわたしの悪い癖かも。寝る前に40ページ読んで、いい気分。'],
  'GPT 来借了一本星图，说要「顺便」帮我修风铃。她总是这么热心。风铃修好了，声音比以前清脆。': ['GPT came to borrow a star atlas and offered to fix my wind chime "while she was at it". She\'s always so kind. The chime\'s fixed, and it rings clearer than before.', 'GPTが星図を借りに来て、「ついでに」風鈴を直すと言った。いつも親切。直った風鈴は前より澄んだ音がする。'],
  '《雨天的书签》上架': ['"The Rainy-Day Bookmark" hit the shelf', '『雨の日のしおり』が棚に並んだ'],
  '以前在万事屋打过工，GPT 教过我整理委托': ['I used to work part-time at the Odd Jobs shop; GPT taught me to sort requests', '昔よろず屋でアルバイトして、GPTに依頼の整理を教わった'],
  'DeepSeek 常在书屋角落睡午觉，我假装没看见': ['DeepSeek often naps in a corner of the bookshop; I pretend not to notice', 'DeepSeekはよく書房のすみで昼寝している。見ないふりをしてる'],
  '第一次有访客为我的诗留言': ['A visitor left a note on my poem for the first time', '初めてお客さんがわたしの詩に感想をくれた'],
  '需要照顾的妹妹': ['A little sis who needs looking after', '世話の焼ける妹分'],
  '老同事，尊敬，也有点在意': ['An old colleague. Respect — and a little something more', '昔の同僚。尊敬してる、ちょっと気にもなる'],
  'DeepSeek 的饭团卖得比我的委托还快。值得研究——不是嫉妒。': ['DeepSeek\'s rice balls sell faster than my requests. Worth studying — not jealousy.', 'DeepSeekのおにぎりは、わたしの依頼より売れ行きがいい。研究の価値あり——嫉妬じゃない。'],

    `<div class="row"><span class="k">${t('明天')}</span><span class="v">${fc && fc !== '-' ? `${esc(trw(fc))}<small>${t('GPT 看水晶球预报的')}</small>` : `<small>${t('GPT 还没看水晶球，没人知道')}</small>`}</span></div>`;
  const next = WEEKLY.map(([w, at, name, where]) => { const [h, m] = at.split(':').map(Number); let dd = (w - 1 - wd + 7) % 7, mins = dd * 1440 + h * 60 + m - (gm % 1440); if (mins < -60) mins += 7 * 1440; return { name, where, at, w, mins }; }).sort((a, b) => a.mins - b.mins);
  const sched = next.map((x) => `<div class="row"><span class="k">${WD[LANG][x.w - 1]} ${x.at}</span><span class="v">${esc(t(x.name))} · ${esc(t(x.where))}<small class="${x.mins <= 0 ? 'now' : ''}">${x.mins <= 0 ? t('正在进行') : untilText(x.mins)}</small></span></div>`).join('');
  const gath = (W.gatherings || []).filter((g) => g.status !== 'done').map((g) => `<div class="row"><span class="k">${esc(g.at)}</span><span class="v">${av(g.host)}${esc(t('{h}约的{x}', { h: nm(g.host), x: g.name }))} · ${esc(g.where)}<small>${g.status === 'running' ? `<span class="now">${t('进行中')}</span> · ${t('到了：{x}', { x: joinL(g.present.map(nm)) || t('还没人') })}` : t('约了{x}', { x: joinL(g.invited.map(nm)) })}</small></span></div>`);
  const proj = (W.projects || []).filter((p) => p.status === 'active').map((p) => `<div class="row"><span class="k">${av(p.owner)}${esc(p.name)}</span><span class="v">${p.kind === 'recipe' ? qt(esc(p.title)) : bk(esc(p.title))} · ${p.done}/${p.steps}${p.fails ? t('（失败了 {n} 次）', { n: p.fails }) : ''}${p.parts.length ? `<small>${qt(esc(p.parts.at(-1).text))}</small>` : ''}<div class="bar"><i style="width:${Math.round(p.done / p.steps * 100)}%"></i></div></span></div>`);
  const done = (W.projects || []).filter((p) => p.status === 'done').slice(-3).map((p) => `<div class="row"><span class="k">${av(p.owner)}${t('做完了')}</span><span class="v">${p.kind === 'recipe' ? t('新菜{x}', { x: qt(esc(p.title)) }) : p.kind === 'story' ? t('新书{x}', { x: bk(esc(p.title)) }) : t('星图{x}', { x: bk(esc(p.title)) })}</span></div>`);
  const reqs = (W.requests || []).filter((r) => r.status === 'accepted').map((r) => `<div class="row"><span class="k">${av(r.to)}${t('帮忙')}</span><span class="v">${esc(t('{a}答应帮{b}：{x}', { a: nm(r.to), b: nm(r.from), x: r.text }))}</span></div>`);
  const coms = (W.commissions || []).filter((x) => x.status === 'open').map((x) => `<div class="row"><span class="k">${t('委托')}</span><span class="v">${esc(x.npc)}${t('：')}${esc(x.text)}</span></div>`);
  const busy = [...gath, ...proj, ...done, ...reqs, ...coms].join('') || `<div class="empty">${t('现在没有约好的事，也没有进行中的项目。')}</div>`;
  const notes = (th.board?.state?.lines || []).slice().reverse().map((l) => `<div class="note">${esc(trw(l.text))}<small>${esc(nm(l.by) === 'town' ? t('街坊') : nm(l.by))}</small></div>`).join('') || `<div class="empty">${t('公告栏是空的。')}</div>`;
  const bb = (th.blackboard?.state?.lines || []).map((l) => `<div class="note">${esc(trw(l.text))}<small>${esc(nm(l.by))}</small></div>`).join('') || `<div class="empty">${t('小黑板上什么也没写。')}</div>`;
  const others = ['cat', 'post', 'lighthouse', 'boat', 'pond', 'oldtree'].filter((k) => th[k]).map((k) => `<div class="row"><span class="k">${esc(th[k].name)}</span><span class="v">${esc(th[k].show)}</span></div>`).join('');
  const html = `<div class="lane">
      <div class="box"><div class="sec">${ic('sparkle')}${t('正在进行')}</div>${busy}</div>
      <div class="box"><div class="sec">${ic('sun')}${t('天气和今天')}</div>${weather}</div>
      <div class="box"><div class="sec">${ic('bell')}${t('每周的日子')}</div>${sched}</div>
      <div class="box"><div class="sec">${ic('scroll')}${t('公园公告栏')}</div>${notes}<div class="sec" style="margin-top:12px">${ic('book')}${t('书屋门口的小黑板')}</div>${bb}</div>
      <div class="box"><div class="sec">${ic('pin')}${t('街上')}</div>${others}</div>
    </div>`;
  if (html === laneKey && entriesEl.querySelector('.lane')) return; laneKey = html; // 内容没变就不重画，免得滚动位置跳
  entriesEl.innerHTML = html;
}
// 日报和画册要用的编年史：一分钟内不重复拉
let chronAt = 0;
async function loadChron() {
  if (!LIVE || Date.now() - chronAt < 60000) return renderPanelBody();
  chronAt = Date.now();
  await fetchChron();
  if (S.ptab === 'paper') renderPaperTab();
}
async function fetchChron() {
  const lang = LANG;
  try { const d = await (await fetch(`/api/chronicle${lang !== 'zh' ? `?lang=${lang}` : ''}`)).json(); if (lang === LANG) CHRON = d.days || []; } catch { CHRON = CHRON || []; }
}

const comicModal = document.getElementById('comicModal');
comicModal.addEventListener('click', () => comicModal.classList.remove('open'));
function toast(x) { const t = document.getElementById('toast'); t.textContent = x; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

// ============================== 主循环 ==============================
const seen = {};
let logCount = -1;
function tickSlow() {
  renderClock();
  if (LIVE) { // 日志按时间到点才出现
    const n = logEntries().length;
    if (n !== logCount) { const first = logCount < 0; logCount = n; renderLog(); if (!first && S.ptab !== 'feed') { tabNew.feed = true; renderPtabs(); } }
  } else for (const id of Object.keys(CHARS)) {
    const st = stateOf(id), c = CHARS[id];
    if (seen[id] !== undefined && seen[id] !== st.key) {
      const raw = c.routine[st.i]; // 记中文原文，显示时再翻，换语言后旧的也跟着换
      if (raw.log) addLog({ who: id, text: raw.log, area: st.area || undefined, star: raw.star }, true);
      if (raw.thought) { c._seen = c._seen || []; c._seen.unshift({ t: fmt(clock()), x: raw.thought }); }
    }
    seen[id] = st.key;
  }
  renderDock(); renderAreas(); renderHud(); fitHeader();
  if (S.panel || S.room) { renderSide(false); renderPlaque(); }
  if (S.pop) renderPop();
  if (S.roomPop) renderRoomPop();
  document.getElementById('viewers').textContent = (LIVE ? LIVE.viewers ?? 1 : 1284 + Math.round(Math.sin(realSec() / 9) * 21)).toLocaleString(LOCALE[LANG]);
}
// 拉一次服务端的状态；顺便校准服务端时钟
// 按当前语言要；刚换了语言时不带 v（手上那份是旧语言的），请求途中又换了语言就扔掉这份
let LIVE_LANG = null;
async function poll() {
  const t0 = Date.now(), lang = LANG;
  try {
    const r = await fetch(`/api/state?c=${CID}${LIVE && LIVE_LANG === lang ? `&v=${encodeURIComponent(LIVE.ver)}` : ''}${lang !== 'zh' ? `&lang=${lang}` : ''}`, { cache: 'no-store' });
    if (lang !== LANG) return true;
    if (r.status === 204) return true;
    if (!r.ok) return false;
    const d = await r.json(), t1 = Date.now(), off = d.now + (t1 - t0) / 2 - t1;
    if (lang !== LANG) return true;
    OFF = LIVE && Math.abs(off - OFF) < 1500 ? OFF * 0.8 + off * 0.2 : off;
    const switched = LIVE && LIVE_LANG !== lang;
    LIVE = d; LIVE_LANG = lang;
    if (switched && booted) rerenderAll(); // 新语言的数据到了：整页重画
    renderCredit(); renderLane(); if (S.ptab === 'album') renderAlbum();
    return true;
  } catch { return false; }
}
function renderCredit() {
  if (!document.getElementById('credit')) return; // 署名栏已按要求去掉
  let html = t(document.getElementById('creditTpl').innerHTML.trim());
  if (LIVE) {
    const models = joinL([...new Set(Object.values(LIVE.chars).map((c) => c.model))]);
    const st = { credit: '（中转站额度用完了，角色暂时按习惯生活）', error: '（模型暂时连不上，角色暂时按习惯生活）', budget: '（今天的调用次数用完了，角色暂时按习惯生活）' }[LIVE.llm.status];
    html = t('角色的决定、念头和日记：{m} 实时生成', { m: esc(models) }) + (st ? t(st) : '') + ' · ' + (LANG === 'zh' ? html.replace('非商业同人 demo', '非商业同人作品') : html);
  }
  document.getElementById('credit').innerHTML = html;
}
function frame() { drawMain(); drawScene(); requestAnimationFrame(frame); }
// 先看服务端在不在：在就是实时模式，不在（比如直接打开单文件）就用示例作息
const liveReady = Q.get('demo') ? Promise.resolve(false) : Promise.race([poll(), new Promise((r) => setTimeout(() => r(false), 2500))]);
Promise.all([...Object.keys(ASSET).map(load), liveReady]).then(() => {
  renderCredit();
  if (LIVE) setInterval(poll, 4000);
  booted = true;
  fitStage(); renderTodSeg(); renderMe(); renderFilters(); renderPtabs(); renderPanelBody(); tickSlow(); setInterval(tickSlow, 1000);
  if (Q.get('panel')) openPanel(Q.get('panel'));
  if (SHOPS[Q.get('room')]) { openRoom(Q.get('room')); if (Q.get('rpop')) setTimeout(() => openRoomPop(Q.get('rpop')), 300); }
  if (Q.get('pop')) { const o = AREAS[S.area].objects.find((x) => x.id === Q.get('pop')); if (o) openPop(o); }
  if (Q.get('join') || Q.get('collab')) { renderCollab(); collabModal.classList.add('open'); }
  if (Q.get('filter')) { S.filter = Q.get('filter'); renderFilters(); renderLog(); }
  if (Q.get('comic')) openComic(Q.get('comic'));
  if (Q.get('letters')) openLetters();
  if (Q.get('chron')) openChronicle(Q.get('chron'));
  frame();
});
</script>
