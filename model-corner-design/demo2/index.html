<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸巷 · Whale Lane</title>
<style>
  @font-face { font-family: 'Kuaile'; src: url('assets/kuaile.woff2?v=full') format('woff2'); font-display: swap; } /* 完整字库（7053 字）：标题、漫画题目、日报标题都是模型临时写的，什么字都可能有 */
  :root {
    /* 一套纸张感的暖色：底、卡片、内嵌三层；墨色正文；金色只用来点缀；角色自己的颜色只用在和她有关的地方 */
    --ink: #3a2e28; --ink2: #6b5c52; --mute: #9a8a7d;
    --page: #efe5d8; --paper: #fffaf3; --paper2: #f7eee2; --paper3: #efe2d1; --line: rgba(120, 88, 56, .15);
    --gold: #d9a54a; --red: #e0566e;
    --shadow: 0 1px 2px rgba(70, 45, 25, .06), 0 8px 24px rgba(70, 45, 25, .10);
    --shadow2: 0 24px 64px rgba(40, 24, 12, .30);
    --r: 18px;
    --disp: 'Kuaile', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --body: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--body); }
  body { background: radial-gradient(1100px 620px at 12% -8%, #fff7ea 0%, rgba(255, 247, 234, 0) 62%), radial-gradient(900px 640px at 105% 108%, #ead8c0 0%, rgba(234, 216, 192, 0) 60%), var(--page); }
  button { font-family: inherit; }
  #app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 0 20px 20px; }
  .card { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 顶栏：一条。左边是招牌和三个区域，右边是此刻（时间天气）、围观人数和两个按钮 */
  header.top { display: flex; align-items: center; gap: 14px; height: 70px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 40px; height: 40px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 3px 10px rgba(40, 60, 120, .18); }
  .brand b { display: block; font: 25px/1 var(--disp); letter-spacing: 3px; }
  .brand small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--mute); letter-spacing: .5px; white-space: nowrap; }
  .areas { display: flex; gap: 3px; padding: 4px; margin-left: 14px; background: var(--paper3); border-radius: 999px; box-shadow: inset 0 1px 2px rgba(70, 45, 25, .08); }
  .area { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 5px; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); font: 15px var(--disp); cursor: pointer; white-space: nowrap; transition: background .15s; }
  .area:hover { background: rgba(255, 255, 255, .5); }
  .area.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(70, 45, 25, .12), 0 2px 8px rgba(70, 45, 25, .08); }
  .area .th { width: 30px; height: 30px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .85); flex: none; }
  .area .who { display: flex; padding-left: 4px; }
  .area .who img { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #fff; margin-left: -6px; background: #fff; }
  .area .s { display: none; }
  .top .gap { flex: 1; }
  .when { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 6px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); white-space: nowrap; }
  .dial { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #9a6a12; background: radial-gradient(circle at 35% 30%, #fff8dc, #f6c062); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .08); }
  .dial.dusk { color: #8a3f2a; background: radial-gradient(circle at 35% 30%, #ffe1c8, #ee8f68); }
  .dial.night { color: #eef0ff; background: radial-gradient(circle at 35% 30%, #aab6ff, #4a55a8); }
  .dial svg.i { width: 19px; height: 19px; }
  .when b { display: block; font: 20px/1 var(--disp); letter-spacing: 1px; }
  .when small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--mute); }
  .viewers { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .viewers .live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(224, 86, 110, .18); animation: pulse 1.8s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(224, 86, 110, 0); } }
  .btn { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; font: 15px var(--disp); letter-spacing: 1px; cursor: pointer; white-space: nowrap; transition: transform .1s, box-shadow .15s; }
  .btn:active { transform: translateY(1px); }
  .btn.primary, .btn.dark { background: var(--ink); color: #fff6ea; box-shadow: 0 2px 8px rgba(40, 24, 12, .22); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .btn.violet { background: linear-gradient(#9a84f0, #6b55c9); color: #fff; }
  .btn.soft { background: var(--paper3); color: var(--ink); }
  .btn.warm { background: linear-gradient(#ffcf7a, #f0a83c); color: #5a3a10; }
  .btn.new::after { content: ''; position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--paper); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  /* 加入鲸巷：页面上最显眼的按钮。暖色渐变带一圈光，每隔几秒扫过一道高光、小手挥一下；任何宽度都留着字 */
  .btn.cta { min-height: 46px; padding: 0 20px 0 15px; gap: 9px; overflow: hidden; background: linear-gradient(135deg, #ffa65e, #f0603e); color: #fff; text-shadow: 0 1px 1px rgba(140, 45, 15, .3); box-shadow: 0 4px 14px rgba(240, 96, 62, .4), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn.cta:hover { filter: brightness(1.06); box-shadow: 0 6px 20px rgba(240, 96, 62, .5), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .btn.cta::before { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); transform: skewX(-20deg); animation: ctaShine 6s ease-in-out infinite; pointer-events: none; }
  .btn.cta svg.i { width: 21px; height: 21px; transform-origin: 60% 85%; animation: ctaWave 6s ease-in-out infinite; }
  .btn.cta .txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
  .btn.cta .t { font-size: 16px; }
  .btn.cta .sub { margin-top: 3px; font: 11px var(--body); letter-spacing: .5px; opacity: .92; }
  @keyframes ctaShine { 0%, 68% { left: -60%; } 86%, 100% { left: 130%; } }
  @keyframes ctaWave { 0%, 70%, 92%, 100% { transform: rotate(0); } 75% { transform: rotate(-16deg); } 80% { transform: rotate(12deg); } 85% { transform: rotate(-8deg); } }
  @media (prefers-reduced-motion: reduce) { .btn.cta::before, .btn.cta svg.i { animation: none; } }
  .iconbtn { width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 250, 243, .92); color: var(--ink); cursor: pointer; box-shadow: 0 2px 10px rgba(40, 24, 12, .2); }

  /* 主区：左边是街（地图是主角），右边是伴读栏；两边上下对齐 */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; min-height: 0; align-items: start; }
  .stage-col { min-width: 0; min-height: 0; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
  .stage { position: relative; border-radius: var(--r); overflow: hidden; background: #e7d9c6; box-shadow: 0 0 0 1px var(--line), 0 10px 34px rgba(70, 45, 25, .18); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 地图上的小牌子：这是哪儿、此刻有什么事、光线预览 */
  .hud { position: absolute; z-index: 3; display: flex; gap: 8px; align-items: center; }
  .hud.tl { left: 14px; top: 14px; }
  .hud.tr { right: 14px; top: 14px; }
  .hud.br { right: 14px; bottom: 14px; }
  .hchip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(255, 250, 243, .93); box-shadow: 0 2px 10px rgba(40, 24, 12, .18); font-size: 13px; color: var(--ink); white-space: nowrap; backdrop-filter: blur(6px); }
  .hchip b { font: 15px var(--disp); font-weight: 400; }
  .hchip .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--mute); display: inline-block; vertical-align: middle; }
  .hchip .extra { display: inline-flex; align-items: center; gap: 7px; }
  .hchip.ev { cursor: pointer; background: rgba(58, 46, 40, .9); color: #fff6ea; }
  .hchip.ev.on { background: rgba(224, 86, 110, .94); }
  .hchip.ev small { opacity: .75; font-size: 12px; }
  .todpop { position: absolute; right: 0; bottom: 46px; display: none; flex-direction: column; gap: 2px; padding: 6px; min-width: 132px; }
  .todpop.open { display: flex; }
  .todpop button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; font: 14px var(--disp); color: var(--ink2); cursor: pointer; text-align: left; }
  .todpop button:hover { background: var(--paper2); }
  .todpop button.on { background: var(--ink); color: #fff6ea; }
  .todpop .hint { padding: 4px 8px 2px; }
  .tip { position: absolute; z-index: 4; pointer-events: none; padding: 5px 12px; font: 14px var(--disp); background: rgba(58, 46, 40, .92); color: #fff4e6; border-radius: 999px; transform: translate(-50%, -100%); white-space: nowrap; display: none; }
  .pop { position: absolute; z-index: 6; width: 270px; padding: 14px 16px 12px; transform: translate(-50%, calc(-100% - 16px)); display: none; }
  .pop::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; background: var(--paper); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
  .pop h4 { margin: 0 0 4px; font: 19px var(--disp); display: flex; align-items: center; gap: 6px; }
  .pop p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; color: var(--ink2); }
  .pop .live { font-size: 12.5px; background: var(--paper2); border-radius: 10px; padding: 6px 9px; margin-bottom: 9px; line-height: 1.6; }
  .pop .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pop .row .btn { min-height: 32px; padding: 0 14px; font-size: 13.5px; }
  .pop .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; cursor: pointer; color: var(--mute); }
  .hint { font-size: 12px; color: var(--mute); }

  /* 伴读栏：上面是「她们现在」，下面四个页签：动态、街区、画册、日报 */
  .side-col { display: flex; flex-direction: column; min-height: 0; height: 100%; overflow: hidden; }
  .mates { display: grid; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); }
  .mates h3 { margin: 4px 8px 4px; font: 15px var(--disp); color: var(--mute); font-weight: 400; display: flex; align-items: center; justify-content: space-between; }
  .mates h3 small { font: 11.5px var(--body); }
  .mate { display: grid; grid-template-columns: 48px minmax(0, 1fr) 16px; gap: 11px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s; }
  .mate:hover { background: var(--paper2); }
  .mate .av { position: relative; width: 48px; height: 48px; }
  .mate .av img { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--c); background: #fff; }
  .mate .av .st { position: absolute; right: -3px; bottom: -2px; width: 21px; height: 21px; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .mate .av .st svg.i { width: 13px; height: 13px; }
  .mate .tx { min-width: 0; display: grid; gap: 1px; }
  .mate .nm { display: flex; align-items: baseline; gap: 7px; font: 16px var(--disp); }
  .mate .nm em { font: 10.5px var(--body); font-style: normal; color: var(--mute); background: var(--paper2); border-radius: 6px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .doing { font-size: 13px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .where { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mate .where i { font-style: normal; color: var(--ink2); }
  .mate > svg.i { color: var(--mute); width: 16px; height: 16px; }
  .ptabs { display: flex; gap: 4px; margin: 10px 12px 0; padding: 3px; background: var(--paper3); border-radius: 999px; }
  .ptabs button { position: relative; flex: 1; height: 34px; border: 0; border-radius: 999px; background: transparent; font: 15px var(--disp); color: var(--ink2); cursor: pointer; }
  .ptabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(70, 45, 25, .14); }
  .ptabs button.new::after { content: ''; position: absolute; top: 6px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .filters button { border: 0; border-radius: 999px; padding: 4px 11px 4px 5px; font: 13px var(--disp); background: var(--paper2); cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--ink2); }
  .filters button.txt { padding-left: 11px; }
  .filters button.on { background: var(--ink); color: #fff6ea; }
  .filters button.av { padding: 3px; }
  .filters button.av img { width: 24px; height: 24px; }
  .filters button.av.on { background: var(--c); }
  .filters img { width: 20px; height: 20px; border-radius: 50%; }
  .day { font: 13px var(--disp); color: var(--mute); margin: 12px 0 4px; display: flex; align-items: center; gap: 8px; }
  .day::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .entry { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 7px 6px; border-radius: 12px; cursor: pointer; font-size: 13px; line-height: 1.6; }
  .entry:hover { background: var(--paper2); }
  .entry img, .entry .ico { width: 30px; height: 30px; border-radius: 50%; }
  .entry .ico { display: grid; place-items: center; background: var(--paper3); color: #9a7a50; }
  .entry .ico svg.i { width: 16px; height: 16px; }
  .entry .tm { color: var(--mute); font-size: 11.5px; display: block; }
  .entry.star { background: linear-gradient(90deg, rgba(247, 213, 140, .32), rgba(247, 213, 140, 0)); }
  .entry.star .txt::before { content: '★ '; color: var(--gold); }
  .entry.new { animation: flash 1.6s; }
  @keyframes flash { from { background: rgba(247, 213, 140, .8); } }
  .entry .shot { display: block; margin-top: 6px; width: 100%; max-height: 150px; object-fit: cover; object-position: top; border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  .empty { color: var(--mute); font-size: 13px; padding: 20px 6px; text-align: center; }

  .modal { position: fixed; inset: 0; background: rgba(25, 18, 14, .55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 22px; z-index: 20; }
  .modal.open { display: flex; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; transform: scale(.985); } }
  .panel { width: min(1260px, 100%); height: min(780px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 32vw, 410px); overflow: hidden; border-radius: 26px; background: var(--paper); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  .scene { position: relative; background: #e9dccb; min-width: 0; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .back { position: absolute; left: 16px; top: 16px; z-index: 2; }
  .scene .plaque { position: absolute; right: 16px; top: 16px; z-index: 2; font: 19px var(--disp); background: rgba(255, 248, 238, .94); padding: 7px 18px; border-radius: 999px; box-shadow: var(--shadow); display: flex; gap: 6px; align-items: center; }
  .scene .say { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2; max-width: 80%; background: rgba(255, 255, 255, .95); border-radius: 18px; padding: 10px 18px; font: 16px var(--disp); box-shadow: var(--shadow); display: none; }
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .prof { display: flex; gap: 14px; padding: 20px 22px 12px; align-items: center; }
  .prof img { width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--c); background: #fff; }
  .prof h2 { margin: 0; font: 26px var(--disp); letter-spacing: 1px; }
  .prof .role { color: var(--mute); font-size: 13px; margin-top: 2px; }
  .now { margin: 0 22px; padding: 10px 12px; border-radius: 14px; background: var(--paper2); font-size: 13.5px; display: flex; gap: 8px; align-items: center; line-height: 1.5; }
  .now svg.i { color: var(--c); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px 22px 2px; }
  .stat { font-size: 12px; color: var(--mute); display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px; }
  .stat .bar { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: #efe1cd; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; border-radius: 4px; }
  .tabs { display: flex; gap: 2px; padding: 10px 18px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; font: 16px var(--disp); padding: 8px 10px 9px; color: var(--mute); cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--c); }
  .tabbody { flex: 1; overflow: auto; padding: 14px 22px; font-size: 13.5px; line-height: 1.75; }
  .mono { position: relative; padding: 10px 14px 10px 16px; background: #fff; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 1px 0 var(--line); }
  .mono .tm { font-size: 11.5px; color: #a59484; display: flex; gap: 6px; align-items: center; }
  .mono.live { border: 1.5px dashed var(--c); }
  .mono.live .tm b { color: var(--c); font-weight: 700; }
  .note { font-size: 12px; color: var(--mute); background: var(--paper2); border-radius: 10px; padding: 6px 10px; margin-bottom: 10px; }
  .diary { background: repeating-linear-gradient(#fffdf8 0 29px, #efe0ca 29px 30px); padding: 4px 16px 10px; border-radius: 14px; margin-bottom: 14px; line-height: 30px; box-shadow: 0 1px 0 var(--line); }
  .diary h4 { margin: 0; font: 16px var(--disp); line-height: 34px; display: flex; justify-content: space-between; }
  .diary h4 small { font: 12px var(--body); color: var(--mute); }
  .sec { font: 16px var(--disp); margin: 4px 0 6px; }
  .mem { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .mem .s { color: var(--gold); letter-spacing: -1px; }
  .rel { display: grid; grid-template-columns: 40px 1fr 34px; gap: 10px; align-items: center; padding: 8px 0; }
  .rel img, .rel .ico { width: 40px; height: 40px; border-radius: 50%; }
  .rel .ico { display: grid; place-items: center; background: #f2e3cf; color: #9a7a50; }
  .rel .bar { height: 7px; border-radius: 4px; background: #efe1cd; overflow: hidden; margin-top: 4px; }
  .rel .bar i { display: block; height: 100%; border-radius: 4px; background: #e0566e; }
  .rel b { font-family: var(--disp); font-weight: 400; font-size: 15px; }
  .rel span { color: var(--mute); font-size: 12.5px; }
  .relx { margin: -4px 0 8px 50px; display: grid; gap: 3px; font-size: 12.5px; line-height: 1.5; color: #6b5a48; }
  .relx em { font-style: normal; color: var(--mute); margin-right: 6px; }
  .bag { display: flex; flex-wrap: wrap; gap: 6px; }
  .bag span { padding: 3px 10px; border-radius: 999px; background: #f6ead8; border: 1px solid #ecd9bd; font-size: 12.5px; color: #6b5a48; }
  .plan { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .acts { padding: 12px 22px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .acts .btn { min-height: 36px; padding: 0 16px; font-size: 14px; }
  /* 店里（房间视图） */
  .scene .plaque.link { cursor: pointer; border: 0; color: var(--ink); }
  .scene .plaque.link:hover { background: #fff; }
  .scene .plaque small { font: 13px var(--body); color: var(--mute); }
  .scene .tip { z-index: 5; }
  .scene .pop { width: 250px; }
  .rm-ico { width: 74px; height: 74px; flex: none; border-radius: 50%; border: 3px solid var(--c); background: #fff; color: var(--c); display: grid; place-items: center; }
  .rm-ico svg.i { width: 34px; height: 34px; }

  if (h >= 5 && h < 6.5) { tint = [255, 176, 190, 0.16]; night = (6.5 - h) / 1.5 * 0.4; }

  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${tint[3]})`; ctx.fillRect(0, 0, W, H); ctx.restore();

    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const [x, y] of A.lamps) {

      const g = ctx.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, `rgba(255,214,140,${0.55 * night})`); g.addColorStop(1, 'rgba(255,214,140,0)');
      ctx.fillStyle = g; ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    for (const [x, y, w, hh] of A.windows) {
      const px = (x - cam.x) * sc, py = (y - cam.y) * sc;
      const g = ctx.createRadialGradient(px + w * sc / 2, py + hh * sc / 2, 0, px + w * sc / 2, py + hh * sc / 2, Math.max(w, hh) * sc * 0.75);
      g.addColorStop(0, `rgba(255,200,120,${0.4 * night})`); g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g; ctx.fillRect(px - w * sc * 0.3, py - hh * sc * 0.3, w * sc * 1.6, hh * sc * 1.6);
    }
    ctx.restore();
  }
  return tint;
}

// 画一个区域：主舞台用整张图，详情面板用跟随角色的镜头
function renderArea(ctx, W, H, area, cam, opt = {}) {
  const sc = W / cam.w, t = realSec();
  const im = img[AREAS[area].img];
  if (im && im.naturalWidth) ctx.drawImage(im, cam.x, cam.y, cam.w, cam.h, 0, 0, W, H);
  const pt = MAP_PATCH[area], pim = pt && img[pt[0]];
  if (pim && pim.naturalWidth) ctx.drawImage(pim, (pt[1] - cam.x) * sc, (pt[2] - cam.y) * sc, pim.naturalWidth * sc, pim.naturalHeight * sc);
  critters(ctx, area, cam, sc, t);
  worldGround(ctx, area, cam, sc, t);
  const hits = [];
  const tint = lighting(ctx, area, cam, sc, W, H);
  worldSky(ctx, area, cam, sc, t, W, H);
  if (raining()) { // 下雨：压暗一点，再画斜着落下的雨丝
    ctx.save(); ctx.fillStyle = 'rgba(60,80,110,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(220,235,255,.55)'; ctx.lineWidth = Math.max(1, sc * 1.6); ctx.beginPath();
    for (let k = 0; k < 140; k++) { const x = (k * 97.3 + t * 260) % (W + 60) - 30, y = (k * 53.7 + t * (700 + (k % 5) * 60)) % (H + 40) - 20; ctx.moveTo(x, y); ctx.lineTo(x - 6 * sc, y + 18 * sc); }
    ctx.stroke(); ctx.restore();

  const lay = layerFor(ctx.canvas), lc = lay.getContext('2d');
  lc.setTransform(1, 0, 0, 1, 0, 0); lc.clearRect(0, 0, lay.width, lay.height); lc.setTransform(ctx.getTransform());
  const sts = Object.keys(CHARS).map(stateOf).filter((s) => s.area === area && !s.inside && s.x !== undefined).sort((a, b) => a.y - b.y);
  for (const st of sts) {
    let [mx, my] = [st.x, st.y];
    const seat = !st.s.walk && seatOf(st, actMode(st.id, st));
    if (seat) { const k = Math.min(1, (st.since ?? 1) / 0.5); mx += (seat[0] - mx) * k; my += (seat[1] - my) * k; } // 刚到时从站的地方挪到座位上
    const x = (mx - cam.x) * sc, y = (my - cam.y) * sc;
    // 下雨天在外面（不在遮阳伞下）就撑一把油纸伞：往上走时伞在身后，其余时候在头顶
    const wet = raining() && !(st.s.place === 'umbrella' && !st.s.walk) && !(st.s.fly && st.moving), hc = CHARS[st.id].h * sc;
    const back = wet && st.s.walk && st.moving && facing(st.id, st, realSec()) === 3;
    if (back) propDraw(lc, 'umbrella_back', x + 4 * sc, y - 0.79 * hc, PROPS.umbrella_back.h * sc);
    const riding = st.area === 'park' && !st.s.walk && st.s.place === 'swing' && actMode(st.id, st) === 'swing'; // 荡秋千：人画在会摆的秋千上
    const box = riding ? drawSwing(lc, cam, sc, realSec(), st.id) : charDraw(lc, st.id, st, x, y, sc);
    if (wet && !back && !riding) { // 伞面要在头顶上方，不挡脸；坐着时头低一些
      const lift = seat ? 1.04 : 1.12;
      lc.save(); if (st.s.walk && st.moving && facing(st.id, st, realSec()) === 1) { lc.translate(x, 0); lc.scale(-1, 1); lc.translate(-x, 0); }
      propDraw(lc, 'umbrella', x, y - lift * hc, PROPS.umbrella.h * sc * 0.92); lc.restore();
    }
    if (box) hits.push({ kind: 'char', id: st.id, box, x, y });

  if (tint) { lc.save(); lc.globalCompositeOperation = 'source-atop'; lc.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${tint[3] * 0.5})`; lc.fillRect(0, 0, W, H); lc.restore(); }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(lay, 0, 0); ctx.restore();
  if (!opt.noUi) {
    worldMarks(ctx, area, cam, sc);
    for (const [key, sh] of Object.entries(SHOPS)) {
      if (sh.area !== area) continue;
      const ins = Object.keys(CHARS).map(stateOf).filter((st) => st.inside === key).sort((a, b) => (b.id === sh.owner) - (a.id === sh.owner));
      ins.forEach((st, i) => hits.push({ kind: 'badge', id: st.id, box: badge(ctx, (sh.badge[0] - cam.x) * sc, (sh.badge[1] - cam.y) * sc + i * Math.max(26, 36 * sc), avatarKey(st.id), st.s.text.replace('在店里', '').replace('在书屋', '').replace(/^在/, ''), CHARS[st.id].color, Math.max(11, 16 * sc)) }));
    }
    for (const hit of hits) {
      if (hit.kind !== 'char') continue;
      const st = stateOf(hit.id), c = CHARS[hit.id], top = hit.y - c.h * sc * 1.04;
      if (st.s.say && !st.s.walk) bubble(ctx, hit.x, top, st.s.say, Math.max(12, 17 * sc), c.color);
      else thoughtIcon(ctx, hit.x + c.h * sc * 0.36, top + c.h * sc * 0.1, Math.max(9, 13 * sc), c.color, realSec() + hit.y);
    }
  }
  return hits;
}

function fitStage() {

    return;

  const w = Math.max(360, Math.floor(Math.min(W - sideMin - gap, H * 1.5))), side = Math.max(sideMin, Math.min(520, W - w - gap));
  mainEl.style.gridTemplateColumns = `${w}px ${side}px`; mainEl.style.justifyContent = 'center';
  stage.style.width = `${w}px`; stage.style.height = `${Math.round(w / 1.5)}px`;
  document.getElementById('log').style.height = `${Math.min(H, Math.round(w / 1.5))}px`; // 两栏一样高，底边对齐

new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(document.body); // 窗口变化、顶栏换行时重新排
function drawMain() {

    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 6]); ctx.shadowColor = 'rgba(255,230,170,.9)'; ctx.shadowBlur = 14;

}
function objectsOf(area) {

  for (const o of A.objects) list.push({ kind: 'obj', key: o.id, o });

}

  for (const h of objs) {
    const o = h.o;
    if (o.c && Math.hypot(mx - o.c[0], my - o.c[1]) <= o.c[2]) return h;

  if (pr && PROJ_TXT[pr.kind]) return PROJ_TXT[pr.kind](pr);
  if (kind === 'room' && key === 'diner' && obj === 'menu' && th.counter) return `今日菜单：${(th.counter.state?.menu || []).join(' · ')}`;

  const fs = Math.max(11, Math.min(14, W / 70)), bs = Math.max(12, Math.min(16, W / 52)), bubbles = [];
  for (const ch of chars) {
    const c = CHARS[ch.id], s = ch.e.st.s, top = ch.y - ch.h * 1.02;
    ctx.save(); ctx.globalAlpha = ch.alpha;
    if (s.say && !ch.e.p.moving) bubbles.push({ ch, b: roomBubble(ctx, ch.x, top, s.say, bs, Math.min(W * 0.4, 280), W) });
    else if (roomAct(ch.e.st) === 'sleep') {
      ctx.fillStyle = c.color; ctx.textAlign = 'center';
      for (let i = 0; i < 3; i++) { const ph = (t * 0.5 + i / 3) % 1; ctx.globalAlpha = ch.alpha * (1 - ph); ctx.font = `${bs * (0.8 + ph * 0.7)}px ${FONTD}`; ctx.fillText('z', ch.x + ch.h * (0.22 + ph * 0.14), top + ch.h * (0.22 - ph * 0.22)); }
    } else thoughtIcon(ctx, ch.x + ch.h * 0.3, top + ch.h * 0.12, Math.max(9, ch.h * 0.045), c.color, t + ch.y);

  bubbles.sort((a, b) => a.b.x - b.b.x);
  const placed = [];
  for (const it of bubbles) { // 两个人同时说话时，气泡错开不重叠

    for (let guard = 0; guard < 4; guard++) { const o = placed.find((q) => b.x < q.x + q.w + 4 && q.x < b.x + b.w + 4 && b.y < q.y + q.h + 4 && q.y < b.y + b.h + 4); if (!o) break; b.y = o.y - b.h - 6; }
    placed.push(b);
  }
  for (const it of bubbles) { ctx.save(); ctx.globalAlpha = it.ch.alpha; drawRoomBubble(ctx, it.b, CHARS[it.ch.id].color); ctx.restore(); }
  roomView = { key, ox, oy, sc, chars, L };
}

  const active = (W.events?.active || []).map((e) => e.name);
  const weather = `<div class="row"><span class="k">今天</span><span class="v">第 ${c.day} 天 · 周${WEEK[wd]} · ${esc(W.weather?.name || '')}${W.weather?.today === 'rain' ? `（${W.weather.rain[0]}–${W.weather.rain[1]} 点有雨）` : ''}${today ? `<small>${esc(today)}${active.length ? ` · <span class="now">${esc(active.join('、'))}正在进行</span>` : ''}</small>` : ''}</span></div>` +
    `<div class="row"><span class="k">明天</span><span class="v">${fc && fc !== '-' ? `${esc(fc)}<small>GPT 看水晶球预报的</small>` : '<small>GPT 还没看水晶球，没人知道</small>'}</span></div>`;
  const next = WEEKLY.map(([w, at, name, where]) => { const [h, m] = at.split(':').map(Number); let dd = (w - 1 - wd + 7) % 7, mins = dd * 1440 + h * 60 + m - (gm % 1440); if (mins < -60) mins += 7 * 1440; return { name, where, at, w, mins }; }).sort((a, b) => a.mins - b.mins);
  const sched = next.map((x) => `<div class="row"><span class="k">周${WEEK[x.w - 1]} ${x.at}</span><span class="v">${esc(x.name)} · ${esc(x.where)}<small class="${x.mins <= 0 ? 'now' : ''}">${x.mins <= 0 ? '正在进行' : untilText(x.mins)}</small></span></div>`).join('');
  const gath = (W.gatherings || []).filter((g) => g.status !== 'done').map((g) => `<div class="row"><span class="k">${esc(g.at)}</span><span class="v">${av(g.host)}${esc(nm(g.host))}约的${esc(g.name)} · ${esc(g.where)}<small>${g.status === 'running' ? `<span class="now">进行中</span> · 到了：${g.present.map(nm).join('、') || '还没人'}` : `约了 ${g.invited.map(nm).join('、')}`}</small></span></div>`);
  const proj = (W.projects || []).filter((p) => p.status === 'active').map((p) => `<div class="row"><span class="k">${av(p.owner)}${esc(p.name)}</span><span class="v">${p.kind === 'recipe' ? `「${esc(p.title)}」` : `《${esc(p.title)}》`} · ${p.done}/${p.steps}${p.fails ? `（失败了 ${p.fails} 次）` : ''}${p.parts.length ? `<small>「${esc(p.parts.at(-1).text)}」</small>` : ''}<div class="bar"><i style="width:${Math.round(p.done / p.steps * 100)}%"></i></div></span></div>`);
  const done = (W.projects || []).filter((p) => p.status === 'done').slice(-3).map((p) => `<div class="row"><span class="k">${av(p.owner)}做完了</span><span class="v">${p.kind === 'recipe' ? `新菜「${esc(p.title)}」` : p.kind === 'story' ? `新书《${esc(p.title)}》` : `星图《${esc(p.title)}》`}</span></div>`);
  const reqs = (W.requests || []).filter((r) => r.status === 'accepted').map((r) => `<div class="row"><span class="k">${av(r.to)}帮忙</span><span class="v">${esc(nm(r.to))}答应帮${esc(nm(r.from))}：${esc(r.text)}</span></div>`);
  const coms = (W.commissions || []).filter((x) => x.status === 'open').map((x) => `<div class="row"><span class="k">委托</span><span class="v">${esc(x.npc)}：${esc(x.text)}</span></div>`);
  const busy = [...gath, ...proj, ...done, ...reqs, ...coms].join('') || '<div class="empty">现在没有约好的事，也没有进行中的项目。</div>';
  const notes = (th.board?.state?.lines || []).slice().reverse().map((l) => `<div class="note">${esc(l.text)}<small>${esc(nm(l.by) === 'town' ? '街坊' : nm(l.by))}</small></div>`).join('') || '<div class="empty">公告栏是空的。</div>';
  const bb = (th.blackboard?.state?.lines || []).map((l) => `<div class="note">${esc(l.text)}<small>${esc(nm(l.by))}</small></div>`).join('') || '<div class="empty">小黑板上什么也没写。</div>';
  const others = ['cat', 'post', 'lighthouse', 'boat', 'pond', 'oldtree'].filter((k) => th[k]).map((k) => `<div class="row"><span class="k">${esc(th[k].name)}</span><span class="v">${esc(th[k].show)}</span></div>`).join('');
  const html = `<div class="lane">
      <div class="box"><div class="sec">${ic('sparkle')}正在进行</div>${busy}</div>
      <div class="box"><div class="sec">${ic('sun')}天气和今天</div>${weather}</div>
      <div class="box"><div class="sec">${ic('bell')}每周的日子</div>${sched}</div>
      <div class="box"><div class="sec">${ic('scroll')}公园公告栏</div>${notes}<div class="sec" style="margin-top:12px">${ic('book')}书屋门口的小黑板</div>${bb}</div>
      <div class="box"><div class="sec">${ic('pin')}街上</div>${others}</div>
    </div>`;
  if (html === laneKey && entriesEl.querySelector('.lane')) return; laneKey = html; // 内容没变就不重画，免得滚动位置跳
  entriesEl.innerHTML = html;
}
// 日报和画册要用的编年史：一分钟内不重复拉
let chronAt = 0;
async function loadChron() {
  if (!LIVE || Date.now() - chronAt < 60000) return renderPanelBody();
  chronAt = Date.now();
  try { CHRON = (await (await fetch('/api/chronicle')).json()).days || []; } catch { CHRON = CHRON || []; }
  if (S.ptab === 'paper') renderPaperTab();
}

const comicModal = document.getElementById('comicModal');
comicModal.addEventListener('click', () => comicModal.classList.remove('open'));
function toast(x) { const t = document.getElementById('toast'); t.textContent = x; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

// ============================== 主循环 ==============================
const seen = {};
let logCount = -1;
function tickSlow() {
  renderClock();
  if (LIVE) { // 日志按时间到点才出现
    const n = logEntries().length;
    if (n !== logCount) { const first = logCount < 0; logCount = n; renderLog(); if (!first && S.ptab !== 'feed') { tabNew.feed = true; renderPtabs(); } }
  } else for (const id of Object.keys(CHARS)) {
    const st = stateOf(id), c = CHARS[id];
    if (seen[id] !== undefined && seen[id] !== st.key) {
      if (st.s.log) addLog({ who: id, text: st.s.log, area: st.area || undefined, star: st.s.star }, true);
      if (st.s.thought) { c._seen = c._seen || []; c._seen.unshift({ t: fmt(clock()), x: st.s.thought }); }
    }
    seen[id] = st.key;
  }
  renderDock(); renderAreas(); renderHud();
  if (S.panel || S.room) { renderSide(false); renderPlaque(); }
  if (S.pop) renderPop();
  if (S.roomPop) renderRoomPop();
  document.getElementById('viewers').textContent = LIVE ? String(LIVE.viewers ?? 1) : (1284 + Math.round(Math.sin(realSec() / 9) * 21)).toLocaleString();
}
// 拉一次服务端的状态；顺便校准服务端时钟
async function poll() {
  const t0 = Date.now();
  try {
    const r = await fetch(`/api/state?c=${CID}${LIVE ? `&v=${LIVE.ver}` : ''}`, { cache: 'no-store' });
    if (r.status === 204) return true;
    if (!r.ok) return false;
    const d = await r.json(), t1 = Date.now(), off = d.now + (t1 - t0) / 2 - t1;
    OFF = LIVE && Math.abs(off - OFF) < 1500 ? OFF * 0.8 + off * 0.2 : off;
    LIVE = d;
    renderCredit(); renderLane(); if (S.ptab === 'album') renderAlbum();
    return true;
  } catch { return false; }
}
function renderCredit() {
  if (!document.getElementById('credit')) return; // 署名栏已按要求去掉
  let html = document.getElementById('creditTpl').innerHTML;
  if (LIVE) {
    const models = [...new Set(Object.values(LIVE.chars).map((c) => c.model))].join('、');
    const st = { credit: '（中转站额度用完了，角色暂时按习惯生活）', error: '（模型暂时连不上，角色暂时按习惯生活）', budget: '（今天的调用次数用完了，角色暂时按习惯生活）' }[LIVE.llm.status] || '';
    html = `角色的决定、念头和日记：${esc(models)} 实时生成${st} · ` + html.replace('非商业同人 demo', '非商业同人作品');
  }
  document.getElementById('credit').innerHTML = html;
}
function frame() { drawMain(); drawScene(); requestAnimationFrame(frame); }
// 先看服务端在不在：在就是实时模式，不在（比如直接打开单文件）就用示例作息
const liveReady = Q.get('demo') ? Promise.resolve(false) : Promise.race([poll(), new Promise((r) => setTimeout(() => r(false), 2500))]);
Promise.all([...Object.keys(ASSET).map(load), liveReady]).then(() => {
  renderCredit();
  if (LIVE) setInterval(poll, 4000);
  fitStage(); renderTodSeg(); renderMe(); renderFilters(); renderPtabs(); renderPanelBody(); tickSlow(); setInterval(tickSlow, 1000);
  if (Q.get('panel')) openPanel(Q.get('panel'));
  if (SHOPS[Q.get('room')]) { openRoom(Q.get('room')); if (Q.get('rpop')) setTimeout(() => openRoomPop(Q.get('rpop')), 300); }
  if (Q.get('pop')) { const o = AREAS[S.area].objects.find((x) => x.id === Q.get('pop')); if (o) openPop(o); }
  if (Q.get('join') || Q.get('collab')) { renderCollab(); collabModal.classList.add('open'); }
  if (Q.get('filter')) { S.filter = Q.get('filter'); renderFilters(); renderLog(); }
  if (Q.get('comic')) openComic(Q.get('comic'));
  if (Q.get('letters')) openLetters();
  if (Q.get('chron')) openChronicle(Q.get('chron'));
  frame();
});
</script>
